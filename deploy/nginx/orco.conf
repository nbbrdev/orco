# Proxy reverso do Orçô (ADR-0012, docs/08-infra-deploy.md). Instalação em deploy/README.md:
#   sudo cp deploy/nginx/orco.conf /etc/nginx/sites-available/orco
#   sudo ln -s /etc/nginx/sites-available/orco /etc/nginx/sites-enabled/orco
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d orco.nbbrdev.com -d staging.orco.nbbrdev.com
# O Certbot adiciona o HTTPS (porta 443, certificados e redirecionamento do http) a este arquivo e
# instala a renovação automática.

# Qualquer acesso que não seja pelos nossos domínios (ex.: robôs varrendo o IP): fecha a conexão.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# Produção
server {
    listen 80;
    listen [::]:80;
    server_name orco.nbbrdev.com;
    server_tokens off;
    # Maior requisição aceita (uploads de logo, M2).
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # IP real do cliente (ADR-0005). Substitui, não acrescenta: um X-Forwarded-For enviado pelo
        # próprio cliente é descartado, então ele não consegue se passar por outro IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# Staging
server {
    listen 80;
    listen [::]:80;
    server_name staging.orco.nbbrdev.com;
    server_tokens off;
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
