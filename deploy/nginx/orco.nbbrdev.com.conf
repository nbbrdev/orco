# Site do Orçô no Nginx da VPS (ADR-0012, docs/08-infra-deploy.md). Só o que é do Orçô: o que vale
# para a VPS inteira (site padrão, server_tokens) fica no repositório nbbrdev/vps.
#
# Destino: /etc/nginx/sites-available/orco.nbbrdev.com (+ link em sites-enabled/). Passo a passo em
# deploy/README.md. O `certbot --nginx` adiciona o HTTPS (porta 443, certificados e redirecionamento
# do http) a este arquivo na VPS.

# Produção
server {
    listen 80;
    listen [::]:80;
    server_name orco.nbbrdev.com;
    # Maior requisição aceita (uploads de logo, RN-05: até 5 MB).
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # IP real do cliente (ADR-0005). Substitui, não acrescenta: um X-Forwarded-For enviado pelo
        # próprio cliente é descartado, então ele não consegue se passar por outro IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# Staging
server {
    listen 80;
    listen [::]:80;
    server_name staging.orco.nbbrdev.com;
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
