# Publica o STAGING a cada merge na main com CI verde (docs/08-infra-deploy.md, ADR-0012).
# Confere o commit e chama a receita comum (deploy-vps.yml) com a etiqueta staging-<commit>.
name: Staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual (Actions → Staging → Run workflow), só a partir da main.
  workflow_dispatch:

permissions: {}

# Um deploy de staging por vez, sem cancelar no meio (migration interrompida é pior que fila).
concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    # Só depois de um CI verde num push na main deste repositório (nunca PR ou fork), ou manual na main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      # No disparo manual não há CI "anterior": confere se o commit já passou.
      - name: CI verde nesse commit
        run: |
          passed=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=ci" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          if [ "$passed" -lt 1 ]; then
            echo "::error::O check \"ci\" do commit $SHA não passou (ou ainda não terminou)."
            exit 1
          fi

      - name: Etiqueta e versão
        id: tag
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=staging-$SHA" >> "$GITHUB_OUTPUT"
          echo "version=staging-${SHA:0:7}" >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy
    needs: prepare
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-vps.yml
    # Sem isto, o workflow chamado não enxerga nenhum secret, nem os do environment em que o job
    # dele entra. O repositório não tem secrets próprios: só os do environment staging chegam lá.
    secrets: inherit
    with:
      environment: staging
      ref: ${{ needs.prepare.outputs.sha }}
      image-tag: ${{ needs.prepare.outputs.tag }}
      app-version: ${{ needs.prepare.outputs.version }}
      url: https://staging.orco.nbbrdev.com
      require-vps: false
