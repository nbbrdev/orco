# Aplica as migrations no Supabase de STAGING a cada merge na main que as altere
# (docs/08-infra-deploy.md). Produção só recebe migrations no release (release.yml, NBB-63).
name: DB migrate (staging)

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

# Nunca duas aplicações de migration ao mesmo tempo, e nunca cancelar uma em andamento.
concurrency:
  group: db-migrate-staging
  cancel-in-progress: false

jobs:
  migrate:
    name: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # O environment `staging` guarda só a connection string do banco de staging: sem Access Token
    # da conta Supabase no GitHub (menor privilégio). Session Pooler, porque o runner não tem IPv6.
    environment: staging
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node (versão do .nvmrc) com cache do npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (Supabase CLI fixado no lockfile)
        run: npm ci

      - name: Aplicar migrations pendentes
        run: npx supabase db push --db-url "$SUPABASE_DB_URL"
