# Verificação de todo PR e de todo push na main (docs/08-infra-deploy.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Serviços temporários, só para os testes de integração: Postgres (RLS, login) e Mailpit (envio de
    # e-mail por SMTP). Senhas fictícias: tudo existe apenas durante este job e some com a máquina.
    services:
      mailpit:
        image: axllent/mailpit:v1.31.3
        ports: ["1025:1025", "8025:8025"]
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orco
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d orco"
          --health-interval 2s
          --health-retries 30
    env:
      # Valores fictícios, só para os testes (o Better Auth exige todos). O Google não é chamado de
      # verdade: os testes só conferem o link gerado para ele.
      SITE_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-for-production
      GOOGLE_CLIENT_ID: ci-only-google-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-only-google-client-secret
      DATABASE_URL_OWNER: postgres://orco_owner:orco_owner_ci@localhost:5432/orco
      DATABASE_URL_APP: postgres://app_user:app_user_ci@localhost:5432/orco
      DATABASE_URL_AUTH: postgres://app_auth:app_auth_ci@localhost:5432/orco
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      EMAIL_FROM: "Orçô <nao-responda@orco.nbbrdev.com>"
      MAILPIT_URL: http://localhost:8025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node (versão do .nvmrc) com cache do npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (exatamente o lockfile)
        run: npm ci

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tipos (TypeScript)
        run: npm run typecheck

      # Mesmo roteiro da VPS: roles (superusuário) → migrations (orco_owner) → testes.
      - name: Banco de teste - roles
        run: >-
          psql "postgres://postgres:postgres@localhost:5432/orco"
          -v owner_password=orco_owner_ci
          -v app_user_password=app_user_ci
          -v app_auth_password=app_auth_ci
          -f db/bootstrap/roles.sql

      - name: Banco de teste - migrations
        run: npm run db:migrate

      # Uma execução só (unitários + integração/RLS contra o Postgres real), para a cobertura medir
      # também o código que só roda com banco. 100% obrigatório em money.ts e dates.ts.
      - name: Testes com cobertura (Vitest)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # E2E (NBB-72): o app compilado no navegador, com o Postgres e o Mailpit deste job.
      - name: Navegador do Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Testes E2E (Playwright)
        run: npm run test:e2e

      # Só as dependências de produção (o que roda no servidor). Alertas em ferramentas de
      # desenvolvimento chegam pelo Dependabot, sem travar o CI (decidido em 2026-10-02, NBB-42).
      - name: Auditoria de dependências
        run: npm audit --audit-level=high --omit=dev
