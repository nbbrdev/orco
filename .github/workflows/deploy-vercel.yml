# "Receita de publicar" reutilizável: único arquivo que conhece a Vercel (docs/08-infra-deploy.md).
# Chamado pelo staging.yml (e pelo release.yml na NBB-63). Na migração para a VPS (ADR-0011), só
# este arquivo muda.
name: Deploy (Vercel)

on:
  workflow_call:
    inputs:
      github-environment:
        description: Environment do GitHub com os secrets (staging | production)
        type: string
        required: true
      vercel-environment:
        description: Ambiente da Vercel cujas variáveis são usadas no build (preview | production)
        type: string
        required: true
      ref:
        description: SHA exato a publicar
        type: string
        required: true
      alias:
        description: Domínio fixo apontado para o novo deploy (opcional)
        type: string
        default: ""
    outputs:
      url:
        description: Endereço publicado
        value: ${{ jobs.deploy.outputs.url }}

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.github-environment }}
      url: ${{ steps.publish.outputs.url }}
    outputs:
      url: ${{ steps.publish.outputs.url }}
    env:
      # IDs não são segredo (variables do repositório); o token fica no environment.
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: "1"
      VERCEL: tools/deploy/node_modules/.bin/vercel
      # Inputs passados por variável de ambiente, nunca interpolados no script (evita injeção).
      TARGET: ${{ inputs.vercel-environment }}
      ALIAS: ${{ inputs.alias }}
    steps:
      - name: Checkout do commit validado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Node (versão do .nvmrc) com cache do npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/deploy/package-lock.json

      - name: Instalar dependências do app e o Vercel CLI (lockfiles)
        run: |
          npm ci
          npm ci --prefix tools/deploy

      - name: Baixar configuração e variáveis do ambiente na Vercel
        run: '"$VERCEL" pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"'

      - name: Build
        run: |
          if [ "$TARGET" = "production" ]; then
            "$VERCEL" build --prod --token="$VERCEL_TOKEN"
          else
            "$VERCEL" build --token="$VERCEL_TOKEN"
          fi

      - name: Publicar
        id: publish
        run: |
          if [ "$TARGET" = "production" ]; then
            deployment_url=$("$VERCEL" deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            deployment_url=$("$VERCEL" deploy --prebuilt --token="$VERCEL_TOKEN")
          fi

          if [ -n "$ALIAS" ]; then
            "$VERCEL" alias set "$deployment_url" "$ALIAS" --token="$VERCEL_TOKEN"
            echo "url=https://$ALIAS" >> "$GITHUB_OUTPUT"
          else
            echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          fi
