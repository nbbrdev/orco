# Publica em PRODUÇÃO quando o usuário cria uma release (docs/06-regras-dev.md §4.1, ADR-0010):
#   gh release create vX.Y.Z --target main --generate-notes
# Confere a tag (formato, commit na main, CI verde) e chama a receita comum (deploy-vps.yml) com a
# etiqueta vX.Y.Z (ADR-0012). Rollback de código: "Re-run all jobs" na execução de uma versão anterior.
name: Production

on:
  release:
    types: [published]

permissions:
  contents: read

# Um deploy de produção por vez, sem cancelar no meio (migration interrompida é pior que fila).
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    env:
      TAG: ${{ github.event.release.tag_name }}
      SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout (histórico completo, para comparar com a main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag no formato vX.Y.Z
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::A tag \"$TAG\" não segue o formato vX.Y.Z (ex.: v0.1.0)."
            exit 1
          fi

      - name: Commit da tag pertence à main
        run: |
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::O commit da tag $TAG ($SHA) não está na main. Crie a release com --target main."
            exit 1
          fi

      - name: CI verde nesse commit
        run: |
          passed=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=ci" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          if [ "$passed" -lt 1 ]; then
            echo "::error::O check \"ci\" do commit $SHA não passou (ou ainda não terminou). Espere o CI da main ficar verde e rode de novo."
            exit 1
          fi

  deploy:
    name: deploy
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-vps.yml
    # Sem isto, o workflow chamado não enxerga nenhum secret, nem os do environment em que o job
    # dele entra. O repositório não tem secrets próprios: só os do environment production chegam lá.
    secrets: inherit
    with:
      environment: production
      ref: ${{ github.sha }}
      image-tag: ${{ github.event.release.tag_name }}
      app-version: ${{ github.event.release.tag_name }}
      url: https://orco.nbbrdev.com
      require-vps: true
