# Receita comum de publicação na VPS (docs/08-infra-deploy.md, ADR-0012). Não roda sozinha: é chamada
# pelo staging.yml e pelo production.yml (`workflow_call`), que passam o ambiente e a versão.
#   build da imagem → GHCR → SSH na VPS → deploy.sh (pull → migrate → up)
# A chave SSH de cada environment só consegue rodar `/opt/orco/bin/deploy.sh <ambiente>` na VPS.
name: Deploy VPS

on:
  workflow_call:
    inputs:
      environment:
        description: "staging ou production (environment do GitHub e ambiente do deploy.sh)"
        required: true
        type: string
      ref:
        description: "Commit a publicar"
        required: true
        type: string
      image-tag:
        description: "Etiqueta da imagem: staging-<commit> ou vX.Y.Z"
        required: true
        type: string
      app-version:
        description: "Versão exibida no app (NEXT_PUBLIC_APP_VERSION)"
        required: true
        type: string
      url:
        description: "Endereço do ambiente (aparece no GitHub, em Deployments)"
        required: true
        type: string
      require-vps:
        description: "true = falta dos secrets da VPS é erro (produção); false = só aviso (staging)"
        required: true
        type: boolean

permissions: {}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ inputs.image-tag }}@${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout do commit a publicar
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login no GHCR (token automático do Actions)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build e envio da imagem
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.image-tag }}
          build-args: NEXT_PUBLIC_APP_VERSION=${{ inputs.app-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Os secrets VPS_* vêm do environment: `staging` só aceita a main; `production`, só tags v*.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    permissions: {}
    env:
      IMAGE_REF: ${{ needs.build.outputs.image-ref }}
      REQUIRE_VPS: ${{ inputs.require-vps }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      # Staging sem VPS configurada: publica a imagem e pula o deploy com um aviso.
      # Produção sem VPS configurada: erro, porque uma release precisa chegar ao ar.
      - name: VPS configurada?
        id: check
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$REQUIRE_VPS" = "true" ]; then
            echo "::error::Secrets VPS_* ausentes neste environment. Veja deploy/README.md."
            exit 1
          else
            echo "::warning::Secrets VPS_* ausentes neste environment: deploy pulado. Veja deploy/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Chave SSH e host conhecido
        if: steps.check.outputs.ready == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # O texto enviado vira $SSH_ORIGINAL_COMMAND no deploy.sh, que valida o formato.
      - name: Deploy na VPS
        if: steps.check.outputs.ready == 'true'
        run: >-
          ssh -i ~/.ssh/deploy_key
          -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes
          -o BatchMode=yes
          "$VPS_USER@$VPS_HOST" "$IMAGE_REF"
