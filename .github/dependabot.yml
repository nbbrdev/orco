# Atualizações automáticas de dependências (ADR-0007): semanais, minor/patch agrupados.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-e-patch:
        update-types: [minor, patch]
    # Majors ignorados de propósito (revisar periodicamente):
    ignore:
      # Os tipos do Node acompanham o runtime do projeto (Node 24, .nvmrc).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # ESLint 10: eslint-plugin-react (via eslint-config-next) ainda quebra (react/display-name).
      # Remover quando o eslint-config-next suportar ESLint 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (reescrito em Go): typescript-eslint ainda não suporta.
      # Remover quando typescript-eslint suportar TS 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @hookform/resolvers 5.4.1+ declara dezenas de dependências opcionais (@typeschema/*) que
      # conflitam com o zod 4 no npm 11 e quebram a instalação. Fixado em 5.4.0 (NBB-39). Reavaliar
      # quando o pacote corrigir.
      - dependency-name: "@hookform/resolvers"
        versions: [">5.4.0"]

  # Imagem base do Dockerfile (Node).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # O projeto fica no Node 24 LTS (.nvmrc); troca de major é decisão própria.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # Imagens dos compose (Postgres, RustFS, Mailpit): local e VPS.
  - package-ecosystem: docker-compose
    directories: ["/", "/deploy"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      compose:
        patterns: ["*"]
    ignore:
      # Major do Postgres (17 → 18) não é só trocar a imagem: exige dump e restauração dos dados.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    labels: [dependencies]
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
